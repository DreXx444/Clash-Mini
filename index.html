<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Clash Royale 2026</title>
    
    <link rel="icon" type="image/png" href="https://supercell.com/images/27/all_games_clash_royale.60f4776e.png">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --elixir-purple: #a855f7;
            --deploy-gold: #fbbf24;
            --blue: #3b82f6;
            --red: #ef4444;
        }

        body { 
            background: #020617; 
            margin: 0; 
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Luckiest Guy', cursive;
            overflow: hidden;
        }

        /* КОНТЕЙНЕР (Оптимизиран за PC и Mobile) */
        #game-wrapper {
            position: relative;
            width: 95%;
            max-width: 420px;
            height: 92vh;
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(20px);
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 2.5rem;
            display: flex;
            flex-direction: column;
            box-shadow: 0 40px 100px rgba(0,0,0,0.9);
            z-index: 10;
        }

        /* АРЕНА */
        #arena {
            flex: 1;
            position: relative;
            margin: 10px;
            background: #1e293b;
            border-radius: 2rem;
            overflow: hidden;
            border: 4px solid #0f172a;
        }

        /* КУЛИ */
        .tower {
            position: absolute;
            width: 70px; height: 90px;
            background-size: contain; background-repeat: no-repeat;
            z-index: 20; display: flex; justify-content: center;
        }
        .tower.player { bottom: 10px; left: 50%; transform: translateX(-50%); background-image: url('https://cdn-icons-png.flaticon.com/512/3021/3021664.png'); }
        .tower.enemy { top: 10px; left: 50%; transform: translateX(-50%) rotate(180deg); background-image: url('https://cdn-icons-png.flaticon.com/512/3021/3021664.png'); filter: hue-rotate(140deg); }

        /* ГЕРОИ */
        .unit {
            position: absolute;
            width: 50px; height: 50px;
            background-size: contain; background-repeat: no-repeat;
            z-index: 30; transition: top 0.1s linear, left 0.1s linear;
        }

        .hp-box {
            width: 45px; height: 6px; background: #000; border: 1px solid #fff;
            border-radius: 3px; position: absolute; top: -12px; left: 50%; transform: translateX(-50%); overflow: hidden;
        }
        .hp-fill { height: 100%; width: 100%; transition: width 0.2s; }
        .fill-p { background: var(--blue); }
        .fill-e { background: var(--red); }

        /* DEPLOY BAR */
        .deploy-bar {
            position: absolute; bottom: -5px; width: 100%; height: 4px;
            background: var(--deploy-gold); border-radius: 2px;
            animation: deploy-anim 1s linear forwards;
        }
        @keyframes deploy-anim { from { width: 0%; } to { width: 100%; } }

        /* UI */
        #ui {
            padding: 20px;
            background: rgba(0,0,0,0.5);
            border-radius: 0 0 2.5rem 2.5rem;
        }

        .elixir-container {
            width: 100%; height: 20px; background: #2d1b4e;
            border-radius: 10px; border: 2px solid #581c87; overflow: hidden; position: relative; margin-bottom: 15px;
        }
        #elixir-bar { width: 0%; height: 100%; background: linear-gradient(90deg, #a855f7, #d8b4fe); }

        .hand { display: flex; justify-content: center; gap: 10px; }
        .card {
            width: 80px; height: 105px;
            background: #334155; border: 2px solid #475569;
            border-radius: 12px; display: flex; flex-direction: column;
            align-items: center; justify-content: center; cursor: pointer;
            position: relative; transition: 0.2s;
        }
        .card:hover:not(.locked) { transform: translateY(-5px); border-color: #fff; }
        .card.locked { opacity: 0.3; filter: grayscale(1); cursor: not-allowed; }
        .card-cost {
            position: absolute; top: -8px; left: -8px; width: 26px; height: 26px;
            background: var(--elixir-purple); border-radius: 50%; display: flex; 
            align-items: center; justify-content: center; font-size: 12px; border: 2px solid #fff;
            color: white;
        }
        .card img { width: 60px; height: 60px; object-fit: contain; }
    </style>
</head>
<body>

<main id="game-wrapper">
    <div id="arena">
        <div class="tower enemy" id="e-tower"><div class="hp-box"><div id="e-hp-bar" class="hp-fill fill-e"></div></div></div>
        <div class="tower player" id="p-tower"><div class="hp-box"><div id="p-hp-bar" class="hp-fill fill-p"></div></div></div>
        <div id="entities"></div>
    </div>

    <div id="ui">
        <div class="elixir-container">
            <div id="elixir-bar"></div>
            <div class="absolute inset-0 flex justify-center items-center text-[11px] text-white">💧 <span id="elixir-val" class="ml-1">0</span></div>
        </div>
        <div class="hand" id="hand"></div>
    </div>
</main>

<script>
    let elixir = 0;
    let units = [];
    let towers = { p: 1000, e: 1000 };
    
    const heroesData = [
        { name: 'Knight', cost: 3, hp: 200, dmg: 15, speed: 0.5, img: 'https://cdn-icons-png.flaticon.com/512/1065/1065524.png' },
        { name: 'Archer', cost: 2, hp: 100, dmg: 20, speed: 0.7, img: 'https://cdn-icons-png.flaticon.com/512/3253/3253130.png' },
        { name: 'Giant', cost: 5, hp: 500, dmg: 25, speed: 0.3, img: 'https://cdn-icons-png.flaticon.com/512/924/924514.png' },
        { name: 'Mage', cost: 4, hp: 120, dmg: 35, speed: 0.6, img: 'https://cdn-icons-png.flaticon.com/512/3669/3669973.png' },
        { name: 'Gnome', cost: 2, hp: 60, dmg: 10, speed: 1.2, img: 'https://cdn-icons-png.flaticon.com/512/4334/4334032.png' }
    ];

    let myHand = [];

    function startLoop() {
        units.forEach(u => u.el.remove());
        units = [];
        towers = { p: 1000, e: 1000 };
        document.getElementById('e-hp-bar').style.width = '100%';
        document.getElementById('p-hp-bar').style.width = '100%';
        
        // Избиране на 3 случайни героя за тази игра
        myHand = [...heroesData].sort(() => 0.5 - Math.random()).slice(0, 3);
        renderHand();
    }

    function renderHand() {
        const h = document.getElementById('hand');
        h.innerHTML = '';
        myHand.forEach(hero => {
            const c = document.createElement('div');
            c.className = 'card locked';
            c.id = 'card-' + hero.name;
            c.onclick = () => play(hero);
            c.innerHTML = `<div class="card-cost">${hero.cost}</div><img src="${hero.img}">`;
            h.appendChild(c);
        });
    }

    setInterval(() => {
        if (elixir < 10) { elixir += 0.04; updateUI(); }
        if (Math.random() < 0.006) spawnUnit(heroesData[Math.floor(Math.random()*heroesData.length)], 'enemy');
        engine();
    }, 50);

    function updateUI() {
        document.getElementById('elixir-bar').style.width = (elixir * 10) + '%';
        document.getElementById('elixir-val').innerText = Math.floor(elixir);
        myHand.forEach(hero => {
            const card = document.getElementById('card-' + hero.name);
            if (elixir >= hero.cost) card.classList.remove('locked');
            else card.classList.add('locked');
        });
    }

    function play(hero) {
        if (elixir >= hero.cost) {
            elixir -= hero.cost;
            spawnUnit(hero, 'player');
        }
    }

    function spawnUnit(hero, team) {
        const el = document.createElement('div');
        el.className = `unit ${team}`;
        el.style.backgroundImage = `url(${hero.img})`;
        if(team === 'enemy') el.style.filter = 'hue-rotate(150deg) brightness(0.7)';
        
        const hp = document.createElement('div');
        hp.className = 'hp-box';
        const fill = document.createElement('div');
        fill.className = `hp-fill ${team === 'player' ? 'fill-p' : 'fill-e'}`;
        hp.appendChild(fill);
        el.appendChild(hp);

        const dep = document.createElement('div');
        dep.className = 'deploy-bar';
        el.appendChild(dep);

        document.getElementById('entities').appendChild(el);
        
        setTimeout(() => {
            dep.remove();
            units.push({
                el, fill, team, stats: hero,
                y: team === 'player' ? 80 : 10,
                hp: hero.hp, active: true
            });
        }, 1000);
    }

    function engine() {
        units.forEach((u, i) => {
            let moving = true;
            units.forEach(other => {
                if (u.team !== other.team && Math.abs(u.y - other.y) < 8) {
                    moving = false;
                    other.hp -= u.stats.dmg / 25;
                    other.fill.style.width = (other.hp / other.stats.hp * 100) + '%';
                }
            });

            let tDist = u.team === 'player' ? u.y - 15 : 85 - u.y;
            if (tDist < 5) {
                moving = false;
                let t = u.team === 'player' ? 'e' : 'p';
                towers[t] -= u.stats.dmg / 40;
                document.getElementById(`${t}-hp-bar`).style.width = (towers[t] / 10) + '%';
            }

            if (moving) {
                u.y += (u.team === 'player' ? -u.stats.speed : u.stats.speed);
                u.el.style.top = u.y + '%';
                u.el.style.left = '50%';
                u.el.style.transform = 'translateX(-50%)';
            }

            if (u.hp <= 0) { u.el.remove(); units.splice(i, 1); }
        });

        if (towers.e <= 0 || towers.p <= 0) {
            alert(towers.e <= 0 ? "ПОБЕДА! НОВА БИТКА..." : "ЗАГУБА! ОПИТАЙ ПАК...");
            startLoop();
        }
    }

    startLoop();
</script>
</body>
</html>
