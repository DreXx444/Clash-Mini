<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Clash Royale 2026 - Ultra Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&display=swap" rel="stylesheet">
    <style>
        :root {
            --elixir: #f03e9b;
            --player: #3b82f6;
            --enemy: #ef4444;
        }

        body { 
            background: #05080f; 
            margin: 0; 
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Luckiest Guy', cursive;
            overflow: hidden;
            color: white;
        }

        /* ЕФЕКТИ НА ФОНА (КАТО ПРИ КАЛКУЛАТОРА) */
        .orb {
            position: absolute;
            width: 400px; height: 400px;
            border-radius: 50%;
            filter: blur(100px);
            opacity: 0.2;
            z-index: 1;
        }
        .orb-blue { background: var(--player); top: -10%; left: -10%; }
        .orb-red { background: var(--enemy); bottom: -10%; right: -10%; }

        /* ГЛАВЕН КОНТЕЙНЕР - ОПТИМИЗИРАН ЗА КОМПЮТЪР */
        #game-wrapper {
            position: relative;
            z-index: 10;
            width: 95%;
            max-width: 450px;
            height: 90vh;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 3rem;
            display: flex;
            flex-direction: column;
            box-shadow: 0 50px 100px rgba(0,0,0,0.8);
            overflow: hidden;
        }

        /* АРЕНА */
        #arena {
            flex: 1;
            position: relative;
            background: rgba(0,0,0,0.2);
            margin: 15px;
            border-radius: 2rem;
            border: 2px solid rgba(255,255,255,0.05);
            overflow: hidden;
        }

        .river {
            position: absolute;
            top: 50%; width: 100%; height: 20px;
            background: rgba(59, 130, 246, 0.2);
            transform: translateY(-50%);
            border-top: 1px solid rgba(59, 130, 246, 0.4);
        }

        /* КУЛИ */
        .tower {
            position: absolute;
            width: 70px; height: 70px;
            background-size: contain; background-repeat: no-repeat;
            z-index: 20; display: flex; justify-content: center;
        }
        .tower.player { bottom: 20px; left: 50%; transform: translateX(-50%); background-image: url('https://cdn-icons-png.flaticon.com/512/3021/3021664.png'); }
        .tower.enemy { top: 20px; left: 50%; transform: translateX(-50%) rotate(180deg); background-image: url('https://cdn-icons-png.flaticon.com/512/3021/3021664.png'); filter: hue-rotate(140deg); }

        /* HP БАРОВЕ */
        .hp-box {
            width: 50px; height: 6px; background: #000; border: 1px solid #fff;
            border-radius: 3px; position: absolute; top: -12px; overflow: hidden;
        }
        .hp-fill { height: 100%; width: 100%; transition: width 0.2s; }
        .fill-p { background: var(--player); }
        .fill-e { background: var(--enemy); }

        /* ЕДИНИЦИ */
        .unit {
            position: absolute;
            width: 35px; height: 35px;
            background-size: contain; background-repeat: no-repeat;
            z-index: 30; transition: transform 0.1s linear;
        }

        /* UI ПАНЕЛ */
        #ui {
            height: 200px;
            background: rgba(255,255,255,0.05);
            border-top: 1px solid rgba(255,255,255,0.1);
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }

        .elixir-container {
            width: 100%; height: 16px; background: rgba(0,0,0,0.5);
            border-radius: 10px; border: 1px solid #444; overflow: hidden; position: relative;
        }
        #elixir-bar { width: 0%; height: 100%; background: linear-gradient(90deg, #d53f8c, #f687b3); transition: width 0.1s; }

        .hand { display: flex; gap: 10px; }
        .card {
            width: 70px; height: 90px;
            background: rgba(255,255,255,0.05);
            border: 2px solid rgba(255,255,255,0.1);
            border-radius: 1rem;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            cursor: pointer; position: relative; transition: 0.2s;
        }
        .card:hover:not(.locked) { transform: translateY(-5px); border-color: #fff; background: rgba(255,255,255,0.1); }
        .card.locked { opacity: 0.3; cursor: not-allowed; filter: grayscale(1); }
        .card-cost {
            position: absolute; top: -5px; left: -5px; width: 22px; height: 22px;
            background: var(--elixir); border-radius: 50%; display: flex; 
            align-items: center; justify-content: center; font-size: 10px; border: 1px solid #fff;
        }
        .card img { width: 40px; height: 40px; margin-bottom: 5px; }
        .card span { font-size: 8px; color: #aaa; }
    </style>
</head>
<body>

<div class="orb orb-blue"></div>
<div class="orb orb-red"></div>

<main id="game-wrapper">
    <div id="arena">
        <div class="river"></div>
        
        <div class="tower enemy" id="e-tower">
            <div class="hp-box"><div id="e-hp-bar" class="hp-fill fill-e"></div></div>
        </div>
        <div class="tower player" id="p-tower">
            <div class="hp-box"><div id="p-hp-bar" class="hp-fill fill-p"></div></div>
        </div>

        <div id="stage"></div>
    </div>

    <div id="ui">
        <div class="elixir-container">
            <div id="elixir-bar"></div>
            <div class="absolute inset-0 flex justify-center items-center text-[9px]">💧 ELIXIR: <span id="elixir-val" class="ml-1">0</span></div>
        </div>

        <div class="hand">
            <div class="card locked" id="c-knight" onclick="play('knight')">
                <div class="card-cost">3</div>
                <img src="https://cdn-icons-png.flaticon.com/512/1065/1065524.png">
                <span>KNIGHT</span>
            </div>
            <div class="card locked" id="c-archer" onclick="play('archer')">
                <div class="card-cost">2</div>
                <img src="https://cdn-icons-png.flaticon.com/512/3253/3253130.png">
                <span>ARCHER</span>
            </div>
