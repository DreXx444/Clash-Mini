<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Clash Mini 2026</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #0f172a; margin: 0; overflow: hidden; font-family: sans-serif; }
        
        /* Арената */
        #arena {
            width: 100vw;
            height: 70vh;
            background: linear-gradient(#1e293b 2px, transparent 2px),
                        linear-gradient(90deg, #1e293b 2px, transparent 2px);
            background-size: 40px 40px;
            background-color: #0f172a;
            position: relative;
            border-bottom: 4px solid #334155;
        }

        /* Кули */
        .tower {
            position: absolute;
            width: 60px;
            height: 60px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: white;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }
        .player-tower { background: #2563eb; bottom: 20px; left: calc(50% - 30px); border: 4px solid #60a5fa; }
        .enemy-tower { background: #e11d48; top: 20px; left: calc(50% - 30px); border: 4px solid #fb7185; }

        /* Единици */
        .unit {
            position: absolute;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            transition: transform 0.1s linear;
            z-index: 5;
        }

        /* Интерфейс долу */
        #ui {
            width: 100vw;
            height: 30vh;
            background: #1e293b;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .elixir-bar-container {
            width: 90%;
            height: 20px;
            background: #334155;
            border-radius: 10px;
            overflow: hidden;
            border: 2px solid #475569;
        }
        #elixir-fill {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #db2777, #f472b6);
            transition: width 0.1s linear;
        }

        .cards { display: flex; gap: 10px; }
        .card {
            width: 70px;
            height: 90px;
            background: #334155;
            border: 3px solid #475569;
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: white;
            font-size: 10px;
            font-weight: bold;
        }
        .card:active { transform: scale(0.95); }
        .card.disabled { opacity: 0.5; cursor: not-allowed; }
    </style>
</head>
<body>

    <div id="arena">
        <div class="tower enemy-tower" id="enemyTower">HP: 100</div>
        <div class="tower player-tower" id="playerTower">HP: 100</div>
    </div>

    <div id="ui">
        <div class="elixir-bar-container">
            <div id="elixir-fill"></div>
        </div>
        <div class="text-pink-400 font-bold text-xs">ELIXIR: <span id="elixir-text">0</span></div>
        
        <div class="cards">
            <div class="card" onclick="spawnUnit('knight', 3)">
                <span>KNIGHT</span>
                <span class="text-pink-400">💧 3</span>
            </div>
            <div class="card" onclick="spawnUnit('archer', 2)">
                <span>ARCHER</span>
                <span class="text-pink-400">💧 2</span>
            </div>
            <div class="card" onclick="spawnUnit('giant', 5)">
                <span>GIANT</span>
                <span class="text-pink-400">💧 5</span>
            </div>
        </div>
    </div>

    <script>
        let elixir = 0;
        const maxElixir = 10;
        const arena = document.getElementById('arena');
        const units = [];

        // Логика за елексира
        setInterval(() => {
            if (elixir < maxElixir) {
                elixir += 0.1;
                updateUI();
            }
        }, 100);

        function updateUI() {
            document.getElementById('elixir-fill').style.width = (elixir / maxElixir) * 100 + '%';
            document.getElementById('elixir-text').innerText = Math.floor(elixir);
        }

        function spawnUnit(type, cost) {
            if (elixir >= cost) {
                elixir -= cost;
                const unit = document.createElement('div');
                unit.className = 'unit';
                
                // Различни цветове за различните единици
                if(type === 'knight') unit.style.backgroundColor = '#60a5fa';
                if(type === 'archer') unit.style.backgroundColor = '#4ade80';
                if(type === 'giant') {
                    unit.style.backgroundColor = '#fbbf24';
                    unit.style.width = '45px';
                    unit.style.height = '45px';
                }

                unit.style.left = '50%';
                unit.style.bottom = '80px';
                arena.appendChild(unit);

                const unitObj = {
                    element: unit,
                    y: 80,
                    speed: type === 'giant' ? 1 : 2,
                    hp: type === 'giant' ? 200 : 50
                };
                units.push(unitObj);
            }
        }

        // Движение на единиците
        setInterval(() => {
            units.forEach((unit, index) => {
                if (unit.y < 550) { // Движи се нагоре към врага
                    unit.y += unit.speed;
                    unit.element.style.bottom = unit.y + 'px';
                } else {
                    // Атака на кулата
                    console.log("Attacking tower!");
                }
            });
        }, 30);
    </script>
</body>
</html>
